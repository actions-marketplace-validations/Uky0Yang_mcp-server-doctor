[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-doctor"
version = "0.2.0"
description = "Diagnose MCP server configs before Claude, Cursor, Copilot, or your agent fails to load tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Ukyo" }
]
keywords = ["mcp", "model-context-protocol", "ai-agents", "developer-tools", "claude", "cursor", "copilot"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities"
]
dependencies = []

[project.scripts]
mcp-server-doctor = "mcp_server_doctor.cli:main"
mcp-doctor = "mcp_server_doctor.cli:main"

[project.urls]
Homepage = "https://github.com/Uky0Yang/mcp-server-doctor"
Issues = "https://github.com/Uky0Yang/mcp-server-doctor/issues"
